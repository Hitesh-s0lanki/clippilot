[project]
name = "trustvid-backend"
version = "0.1.0"
description = "Backend API for the ClipPilot interactive video campaign builder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "pyjwt[crypto]>=2.9.0",
    "email-validator>=2.2.0",
    "boto3>=1.35.0",
    "langchain-core>=1.6.0",
    "langchain-anthropic>=1.6.0",
    "langchain-openai>=1.0.0",
    "langchain-mcp-adapters>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "httpx2>=2.12.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py", "migrations/*"]
branch = true
# SQLAlchemy's async layer runs application code inside greenlets, and the
# TestClient drives the ASGI app from a worker thread. Without both, coverage
# silently under-reports service code that the tests do execute.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic owns the contents of migrations/versions - they are machine
# generated and rewriting them by hand risks changing the applied DDL.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
