# Local stack: the API image plus the PostgreSQL it is written against.
#
#     docker compose up --build          # http://localhost:8000/docs
#     docker compose run --rm api alembic upgrade head
#     docker compose down -v             # also drops the database volume
#
# Values come from backend/.env when it exists (copy .env.example), with the
# defaults below filling in whatever it does not set. DATABASE_URL is pinned
# here rather than read from .env because inside the network the host is `db`,
# not localhost.

name: clippilot

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trustvid
      POSTGRES_PASSWORD: trustvid
      POSTGRES_DB: trustvid
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvid -d trustvid"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: clippilot-backend:local
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # asyncpg rejects a ?sslmode= parameter, so it is absent here by design.
      DATABASE_URL: postgresql+asyncpg://trustvid:trustvid@db:5432/trustvid
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      ALLOW_DEV_AUTH_HEADER: ${ALLOW_DEV_AUTH_HEADER:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  db-data:
